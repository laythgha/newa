# Render Blueprint: in the Render dashboard choose New > Blueprint and pick this repo.
# Render asks for the values marked "sync: false" and generates ADMIN_TOKEN for you
# (find it later under the service's Environment tab).
services:
  - type: web
    name: resume-chatbot
    runtime: node
    # A paid instance is needed for the persistent disk below.
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Abacus.AI RouteLLM key (or leave empty and set ANTHROPIC_API_KEY instead).
      - key: ABACUS_API_KEY
        sync: false
      - key: ABACUS_MODEL
        value: route-llm
      - key: ANTHROPIC_API_KEY
        sync: false
      # Password for the /admin page.
      - key: ADMIN_TOKEN
        generateValue: true
      # Nezar's look (navy + sky blue, to match his site) and his booking link.
      - key: WIDGET_THEME
        value: navy
      - key: WIDGET_COLOR
        value: "#0f98dc"
      - key: WIDGET_COLOR2
        value: "#1d6fd8"
      - key: BOOKING_URL
        value: https://calendar.app.google/rHowoyL9ZZkULtu38
      - key: WIDGET_SUGGESTIONS
        value: "What has Nezar delivered as a CIO/CTO?|How does Nezar approach AI and cloud modernization?|What kind of roles is Nezar open to?|How can I book a call with Nezar?"
      # Optional overrides (add them later under Environment if needed):
      #   OWNER_NAME       - otherwise read from the top of the resume
      #   ALLOWED_ORIGINS  - otherwise the bot locks to the first website that uses it
      # Keep the documents and index on the persistent disk so admin-page edits survive deploys.
      - key: DOCS_DIR
        value: /var/data/docs
      - key: INDEX_FILE
        value: /var/data/index.json
    disk:
      name: chatbot-data
      mountPath: /var/data
      sizeGB: 1

  # Layth's own portfolio site with the chat widget (answers about Layth).
  # The resume and Q&A come from docs/ in the repo, so there's no disk: edit docs/
  # and push to update it. Free plan: it sleeps when idle and takes ~1 minute to wake.
  - type: web
    name: layth-portfolio
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PORTFOLIO
        value: "true"
      - key: ABACUS_API_KEY
        sync: false
      - key: ABACUS_MODEL
        value: route-llm
      - key: ADMIN_TOKEN
        generateValue: true
