<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chatbot Test Page</title>
<style>
  :root { --text: #0f172a; --muted: #64748b; --bg: #f6f7fb; --card: #ffffff; --border: #e3e6ef; }
  @media (prefers-color-scheme: dark) { :root { --text: #e8eaf3; --muted: #9097b0; --bg: #0b0d17; --card: #111320; --border: #262a3d; } }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 10px; }
  code { font-size: 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 2px 6px; word-break: break-all; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>Chatbot test page</h1>
    <p>This blank page has only the chat widget on it, exactly as it appears on a real website. Click the robot in the corner and ask a question.</p>
    <p>On a website, the whole install is this one line: <code id="line"></code></p>
  </div>
</main>
<script>document.getElementById("line").textContent = '<script src="' + location.origin + '/widget.js" defer></' + 'script>';</script>
<script src="/widget.js" defer></script>
</body>
</html>
